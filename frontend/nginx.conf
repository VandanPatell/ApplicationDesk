server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 11m;
  location = /api/gmail/callback { access_log off; proxy_pass http://backend:4000; }
  location /api/ { proxy_pass http://backend:4000; }
  location / { try_files $uri $uri/ /index.html; }
}
